project:
  output-dir: docs
  type: website
  render:
    - index.qmd
    - Apps/App-113.qmd
    - Apps/App-rotations.qmd
    - Apps/App-GDP-Mortality.qmd
    - Apps/App-SIR.qmd
    - DRILL/Drill-??.qmd
    - READING_QUESTIONS/RQ-??.qmd
    - EXERCISES/Exer-??.qmd


website: 
  title: "Quantitative Argumentation"
  reader-mode: true

format:
  live-html:
    theme: litera
    css: styles.css
    toc: true
    cell-options:
      lines: 3
      render-df: gt
    number-sections: true
    number-depth: 2
    mainfont: "Atkinson Hyperlegible"
    
  
engine: knitr

# Enable webR
webr:
  channel-type: 'automatic'
  repos: ["https://dtkaplan.r-universe.dev"]
  packages: ['mosaicCalc', 'ggplot2', 'ggformula', "dplyr"]
filters:
  - shinylive

